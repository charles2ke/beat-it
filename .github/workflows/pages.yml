name: Update data & deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Every Monday at 06:00 UTC: refresh research, trials and news, then redeploy.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest research, trials and news
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: python3 scripts/update_data.py

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/updates.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Weekly update: latest cancer research and news ($(date -u +%Y-%m-%d))"
            git push
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
