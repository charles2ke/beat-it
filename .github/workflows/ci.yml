name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests (data updater)
        run: python3 -m unittest discover -s scripts -v

      - name: Live data fetch smoke test
        # Verifies PubMed, ClinicalTrials.gov and news feeds are reachable and parse correctly.
        # Output goes to a temp file; committed data is not modified.
        run: python3 scripts/update_data.py --output "$RUNNER_TEMP/updates.json"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright tests
        run: npx playwright test

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results/screenshots/

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
